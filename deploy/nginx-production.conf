# Plantilla nginx de producción (P6-INFRA). Adapta dominio, rutas de certificado y puerto.
# Va en /etc/nginx/sites-available/ ; los bloques `http {}` (zonas, mapas) en /etc/nginx/conf.d/datosprivados-http.conf.
#
# --- /etc/nginx/conf.d/datosprivados-http.conf (contexto http) -----------------
# server_tokens off;
# gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_vary on;
# gzip_types text/css application/javascript application/json image/svg+xml text/plain;
# map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
# limit_req_zone $binary_remote_addr zone=auth:10m  rate=10r/m;   # /login, /registro
# limit_req_zone $binary_remote_addr zone=forms:10m rate=20r/m;   # /solicitud/
# limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;   # /api/
# limit_req_status 429;
# # Cloudflare -> IP real (actualizar con https://www.cloudflare.com/ips-v4 y ips-v6):
# set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;  set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;  set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;    set_real_ip_from 131.0.72.0/22;
# real_ip_header CF-Connecting-IP;
# ------------------------------------------------------------------------------

server {
  listen 80;
  server_name EXAMPLE.PE www.EXAMPLE.PE;
  return 301 https://EXAMPLE.PE$request_uri;
}

server {
  listen 443 ssl http2;
  server_name EXAMPLE.PE;

  ssl_certificate     /etc/letsencrypt/live/EXAMPLE.PE/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/EXAMPLE.PE/privkey.pem;
  # Cloudflare en «Full (strict)»: considera además Authenticated Origin Pulls.

  client_max_body_size 1m;          # no hay subidas de archivos hoy
  proxy_read_timeout   60s;         # >= tiempo máximo de la IA (45 s)
  proxy_connect_timeout 5s;

  location ~ ^/(login|registro|restablecer|olvide) {
    limit_req zone=auth burst=10 nodelay;
    include /etc/nginx/snippets/datosprivados-proxy.conf;
  }
  location /solicitud/ {
    limit_req zone=forms burst=10 nodelay;
    include /etc/nginx/snippets/datosprivados-proxy.conf;
  }
  # Webhooks (MercadoPago/Resend) y tareas: cuota propia y holgada.
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    include /etc/nginx/snippets/datosprivados-proxy.conf;
  }
  location / {
    include /etc/nginx/snippets/datosprivados-proxy.conf;
  }
}

