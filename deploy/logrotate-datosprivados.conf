# Logrotate de la aplicación (copia en /etc/logrotate.d/datosprivados).
# PM2 escribe los logs de Next y el cron del sistema ya va a syslog/journald.
# Rotación semanal con 8 copias: ~2 meses de historia sin llenar el disco.
#
#   sudo cp deploy/logrotate-datosprivados.conf /etc/logrotate.d/datosprivados
#   sudo logrotate --debug /etc/logrotate.d/datosprivados   # comprobar sin rotar
"/root/.pm2/logs/*.log" {
    weekly
    rotate 8
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su root root
}

# Salida del respaldo horario si algún día se escribe a archivo en vez de a syslog.
"/var/log/datosprivados-*.log" {
    weekly
    rotate 8
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
