# Bloque para el vhost de un PREVIEW o STAGING: que Google no lo indexe.
#
# Por qué: el 2026-11-03 el preview respondía `Allow: /` en robots.txt, no mandaba
# X-Robots-Tag y su sitemap anunciaba el dominio de preview. Un preview indexado
# sobrevive al lanzamiento (Google conserva la copia con los textos legales en
# borrador) y compite con el dominio real.
#
# Se pega dentro del bloque `server { ... }` del vhost del preview, a nivel de
# servidor (así aplica a todas las respuestas). `always` hace que también se envíe en
# 404 y 5xx.
#
#   include /etc/nginx/snippets/datosprivados-noindex.conf;   # o pegar la línea tal cual
#   nginx -t && systemctl reload nginx
#   curl -sI https://<preview>/ | grep -i x-robots-tag          # debe aparecer
#
# NUNCA en el vhost de producción: `deploy/nginx-production.conf` no lo lleva y hay una
# prueba (`test/seo-indexing.test.ts`) que falla si alguien se lo copia.

add_header X-Robots-Tag "noindex, nofollow" always;
