# Las dependencias están fijadas en versiones exactas: las actualizaciones llegan
# como PR semanales y pasan por la misma CI (typecheck, lint, tests, build, E2E).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
