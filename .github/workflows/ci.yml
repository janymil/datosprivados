name: CI

# Mientras la app está en desarrollo (decisión del fundador, 14.11.2026): los PR y
# master corren solo las comprobaciones rápidas (~3 min); el E2E corre una vez al día
# (04:00 Lima) y a mano (Run workflow). Antes del lanzamiento vuelve a cada PR.
# Los cambios legales aprobados corren su propio E2E completo (legal-change.yml).
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Escaneo de secretos
        run: pnpm scan:secrets
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Pruebas con suelo de cobertura
        run: pnpm test:coverage
      - run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://ci.example.com
          # Las cabeceras de `headers()` se hornean en el build: la compilación que
          # consume el job de E2E tiene que salir con la CSP bloqueante para que la
          # suite pruebe de verdad ese modo.
          CSP_ENFORCE: "1"
      - name: Guardar la compilación para E2E
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    needs: checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level=high
