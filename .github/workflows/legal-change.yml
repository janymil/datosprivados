# Cambio legal aprobado por el fundador en /operador/legal (motor legal, plan 4).
# El servidor envía un repository_dispatch con { id, branch, head_sha, attempt, diff_sha256 }.
#
# La rama es código ajeno (la proponen agentes que leen fuentes externas), así que:
#   - verify: corre SIN permiso de escritura y sin credenciales guardadas. Comprueba que la
#     rama siga en el commit aprobado y que su diff sea byte a byte el que vio el fundador
#     (sha256), la juzga con las reglas de MASTER (no con las suyas), la fusiona en local
#     sobre master y prueba ESE resultado: secretos, tipos, lint, pruebas, build y E2E.
#   - merge: con permiso de escritura, no ejecuta nada de la rama. Exige que master siga en
#     el commit probado (si se movió, falla: reaprobar) y fusiona el commit aprobado.
# Un push con GITHUB_TOKEN no dispara ci.yml: por eso el E2E corre aquí, antes de fusionar.
# Si algo falla no se fusiona nada; el servidor lee el resultado (legal-change-sync).
name: Cambio legal aprobado
run-name: legal ${{ github.event.client_payload.id }} ${{ github.event.client_payload.attempt }}

on:
  repository_dispatch:
    types: [legal-change-approved]

permissions: {}

# Una cola por cambio: aprobar varios seguidos no cancela ninguno.
concurrency:
  group: legal-change-${{ github.event.client_payload.id }}
  cancel-in-progress: false

env:
  CHANGE_ID: ${{ github.event.client_payload.id }}
  CHANGE_BRANCH: ${{ github.event.client_payload.branch }}
  CHANGE_SHA: ${{ github.event.client_payload.head_sha }}
  ATTEMPT: ${{ github.event.client_payload.attempt }}
  DIFF_SHA256: ${{ github.event.client_payload.diff_sha256 }}

jobs:
  verify:
    name: Validar y probar la fusión
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.base }}
    steps:
      - name: Datos del cambio con forma válida
        run: |
          [[ "$CHANGE_ID" =~ ^lc-[0-9]{8}-[0-9a-f]{6}$ ]] || { echo "id inválido: $CHANGE_ID"; exit 1; }
          [[ "$CHANGE_BRANCH" =~ ^legal/[a-z0-9-]+$ ]] || { echo "rama inválida: $CHANGE_BRANCH"; exit 1; }
          [[ "$CHANGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "commit inválido: $CHANGE_SHA"; exit 1; }
          [[ "$ATTEMPT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]] || { echo "intento inválido: $ATTEMPT"; exit 1; }
          [[ "$DIFF_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "hash del diff inválido"; exit 1; }

      - name: Reglas desde master
        uses: actions/checkout@v4
        with:
          ref: master
          path: rules
          persist-credentials: false

      - name: La rama aprobada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch }}
          path: change
          fetch-depth: 0
          persist-credentials: false

      - name: La rama sigue en el commit aprobado
        working-directory: change
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$CHANGE_SHA" ]; then
            echo "la rama cambió después de aprobar: aprobado $CHANGE_SHA, ahora $head"
            exit 1
          fi

      - name: El diff es exactamente el aprobado
        working-directory: change
        run: |
          actual="$(git diff --no-color --no-ext-diff -M origin/master...HEAD | sha256sum | cut -d' ' -f1)"
          if [ "$actual" != "$DIFF_SHA256" ]; then
            echo "el diff de la rama no es el que se aprobó (sha256 $actual, aprobado $DIFF_SHA256)"
            exit 1
          fi

      - name: Reglas del cambio (las de master)
        working-directory: change
        run: node --experimental-strip-types ../rules/scripts/legal/validate-change.mjs "$CHANGE_ID" origin/master

      - name: Fusión local sobre master
        id: base
        working-directory: change
        run: |
          echo "base=$(git rev-parse origin/master)" >> "$GITHUB_OUTPUT"
          git -c user.name=datosprivados-legal -c user.email=legal@datosprivados.invalid checkout -q -B probado origin/master
          git -c user.name=datosprivados-legal -c user.email=legal@datosprivados.invalid merge --no-ff -q "$CHANGE_SHA" -m "prueba de la fusión"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: change/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: change/pnpm-lock.yaml
      - working-directory: change
        run: pnpm install --frozen-lockfile
      - name: Escaneo de secretos
        working-directory: change
        run: pnpm scan:secrets
      - working-directory: change
        run: pnpm typecheck
      - working-directory: change
        run: pnpm lint
      - name: Pruebas con suelo de cobertura
        working-directory: change
        run: pnpm test:coverage
      - working-directory: change
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://ci.example.com
          CSP_ENFORCE: "1"
      - working-directory: change
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: E2E
        working-directory: change
        run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            change/playwright-report/
            change/test-results/
          retention-days: 7

  merge:
    name: Fusionar en master
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Master sigue donde se probó y el commit aprobado existe
        env:
          BASE: ${{ needs.verify.outputs.base }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$BASE" ]; then
            echo "master cambió mientras se probaba (probado sobre $BASE, ahora $head): volver a aprobar"
            exit 1
          fi
          git cat-file -e "$CHANGE_SHA^{commit}"

      - name: Fusionar
        run: |
          git config user.name "datosprivados-legal"
          git config user.email "legal@datosprivados.invalid"
          git merge --no-ff "$CHANGE_SHA" -m "legal: $CHANGE_ID aprobado" -m "Rama $CHANGE_BRANCH en $CHANGE_SHA, aprobada en /operador/legal (intento $ATTEMPT)."
          git push origin master
